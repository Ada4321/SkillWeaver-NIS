# On every push to main, ask Ada4321/SkillWeaver to point its SkillWeaver-NIS submodule at the new commit.
# Needs the repository secret SKILLWEAVER_DISPATCH_TOKEN (a token allowed to write Ada4321/SkillWeaver);
# without it this step is skipped and the main repository picks the update up on its own schedule.
name: Notify SkillWeaver

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to Ada4321/SkillWeaver
        env:
          TOKEN: ${{ secrets.SKILLWEAVER_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "SKILLWEAVER_DISPATCH_TOKEN is not set; skipping."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/repos/Ada4321/SkillWeaver/dispatches \
            -d '{"event_type": "nis-updated"}'
