[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "isaaclabenvs"
version = "0.0.1"
description = "SkillWeaver Neural Interaction Skills: RL manipulation environments in Isaac Lab."
classifiers = [
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
license = "Apache-2.0"

# Add dependencies here
dependencies = ["open3d ~= 0.19.0", "trimesh[all]", "toml", "moviepy"]

[project.optional-dependencies]
dev = ["ruff", "pre-commit"]

[tool.ruff]
line-length = 120
target-version = "py310"
show-fixes = true

[tool.ruff.lint]

select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["E402"]
per-file-ignores = { "__init__.py" = ["F401"] }
